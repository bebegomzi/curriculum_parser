<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반곡고 2026 선택과목 시뮬레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #0061a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d1e4ff;
            --md-sys-color-on-primary-container: #001d36;
            --md-sys-color-surface: #fdfcff;
            --md-sys-color-outline: #73777f;
            
            --semester-1-color: #0061a4;
            --semester-2-color: #2e6c00;

            /* Category Colors */
            --cat-국어: #ef4444;
            --cat-수학: #f59e0b;
            --cat-영어: #10b981;
            --cat-사회: #3b82f6;
            --cat-과학: #8b5cf6;
            --cat-체육: #6366f1;
            --cat-예술: #ec4899;
            --cat-생활: #64748b;
            --cat-default: #94a3b8;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f3f6;
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--md-sys-color-primary);
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            box-sizing: border-box;
            z-index: 2000;
        }

        .main-tabs {
            display: flex;
            background: white;
            padding: 2px;
            border-bottom: 1px solid #e2e8f0;
            justify-content: center;
            height: 40px;
            box-sizing: border-box;
            z-index: 2000;
        }

        .main-tab-btn {
            padding: 4px 16px;
            border: none;
            background: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--md-sys-color-outline);
        }

        .main-tab-btn.active {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        #simWrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .simulator-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 40px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #e2e8f0;
            z-index: 10;
            overflow-x: auto;
        }

        .semester-panel {
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            height: 100%;
            position: relative;
            border: 1px solid #cbd5e1;
            min-width: 150px;
        }

        /* 하단 페이드 마스크 */
        .semester-panel::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.95));
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
            opacity: 1;
        }
        .semester-panel.scrolled-to-bottom::after { opacity: 0; }

        .semester-header {
            padding: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
            text-align: center;
            z-index: 30;
        }

        .sem-header-1 { background-color: var(--semester-1-color); }
        .sem-header-2 { background-color: var(--semester-2-color); }

        .semester-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px 40px 8px;
            scrollbar-width: thin;
            z-index: 10;
        }

        .semester-content::-webkit-scrollbar { width: 4px; }
        .semester-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .course-item {
            padding: 4px 6px;
            margin-bottom: 6px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.7rem;
            background-color: white;
            position: relative;
            z-index: 10;
            transition: background-color 0.2s;
        }

        .course-item.mandatory { cursor: default; background-color: #f8fafc; }

        .course-item.selected {
            background-color: #f0f9ff !important;
            border-color: #0ea5e9 !important;
        }

        .item-row { display: flex; align-items: flex-start; gap: 6px; width: 100%; }
        .check-box { font-size: 16px; color: #cbd5e1; flex-shrink: 0; }
        .mandatory .check-box { color: #64748b; }
        .selected .check-box { color: #0ea5e9; }
        .course-name { font-weight: 700; flex: 1; line-height: 1.2; word-break: keep-all; }

        .badges-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .tag { padding: 1px 4px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; color: white; }
        
        .group-separator {
            margin: 8px 0 4px;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #475569;
            background-color: #f1f5f9;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        #svgOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .path-arrow {
            stroke-width: 1.5;
            fill: none;
            transition: opacity 0.3s, stroke-width 0.3s;
            opacity: 0.03;
        }

        .path-arrow.active { opacity: 0.3; stroke-width: 2; }
        .path-arrow.selected-path { opacity: 0.8; stroke-width: 4; }

        .summary-bar {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 4px 16px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            height: 32px;
            align-items: center;
            font-size: 0.85rem;
            z-index: 2000;
        }
        .stat-val { font-weight: 700; color: var(--md-sys-color-primary); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:8px;">
        <span class="material-icons-round" style="font-size:20px;">route</span>
        <h1 style="margin:0; font-size:1rem;">반곡고 교육과정 로드맵 시뮬레이터</h1>
    </div>
    <div id="simStats" style="font-size:0.8rem; opacity:0.9;">
        총 이수 학점: <span id="totalCredits" style="font-weight:700;">0</span>
    </div>
</header>

<div class="main-tabs">
    <button class="main-tab-btn active" onclick="switchTab('simulator')">시뮬레이션</button>
    <button class="main-tab-btn" onclick="switchTab('full')">전체 데이터</button>
</div>

<div id="simWrapper">
    <svg id="svgOverlay"></svg>
    <div id="tab-simulator" class="simulator-container"></div>
</div>

<div id="tab-full" class="hidden" style="flex:1; overflow:auto; padding:16px;">
    <div id="fullViewContent"></div>
</div>

<div class="summary-bar" id="summaryBar">
    <div>선택 과목: <span id="totalSelected" class="stat-val">0</span>개 | 필수 학점: <span id="totalMandatoryCredits" class="stat-val">0</span></div>
</div>

<script>
    let rawData = [];
    let selectedCourses = new Set();
    const semesters = ["1-1", "1-2", "2-1", "2-2", "3-1", "3-2"];

    function getCategoryColor(cat) {
        if (cat.includes('국어')) return 'var(--cat-국어)';
        if (cat.includes('수학')) return 'var(--cat-수학)';
        if (cat.includes('영어')) return 'var(--cat-영어)';
        if (cat.includes('사회')) return 'var(--cat-사회)';
        if (cat.includes('과학')) return 'var(--cat-과학)';
        if (cat.includes('체육')) return 'var(--cat-체육)';
        if (cat.includes('예술')) return 'var(--cat-예술)';
        if (cat.includes('생활')) return 'var(--cat-생활)';
        return 'var(--cat-default)';
    }

    async function init() {
        try {
            const response = await fetch("bangok_2026_curriculum_courses_llm.csv");
            if (!response.ok) throw new Error();
            const text = await response.text();
            Papa.parse(text, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    renderSimulator();
                    window.addEventListener('resize', () => drawPaths());
                }
            });
        } catch (e) {
            document.getElementById('tab-simulator').innerHTML = `<div style="grid-column: span 6; padding: 100px; text-align: center;">데이터 로딩 실패.</div>`;
        }
    }

    function switchTab(tab) {
        document.getElementById('simWrapper').classList.toggle('hidden', tab !== 'simulator');
        document.getElementById('tab-full').classList.toggle('hidden', tab !== 'full');
        document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes(tab)));
        if (tab === 'full') renderFullView(); else setTimeout(drawPaths, 100);
    }

    function renderSimulator() {
        const container = document.getElementById('tab-simulator');
        container.innerHTML = '';
        semesters.forEach(sem => {
            const col = document.createElement('div');
            col.className = 'semester-panel';
            const [grade, term] = sem.split("-");
            col.innerHTML = `<div class="semester-header ${term === '1' ? 'sem-header-1' : 'sem-header-2'}">${grade}학년 ${term}학기</div>
                             <div class="semester-content" id="content-${sem}" onscroll="drawPaths(event)"></div>`;
            container.appendChild(col);
            const content = col.querySelector('.semester-content');
            const semData = rawData.filter(r => r[`${sem}_학점`] && r[`${sem}_학점`] !== '0');
            
            const mandatory = semData.filter(r => r['학교지정'] === 'True');
            if (mandatory.length > 0) {
                const sep = document.createElement('div'); sep.className = 'group-separator'; sep.innerText = '공통 필수';
                content.appendChild(sep);
                mandatory.forEach(r => content.appendChild(createSimItem(r, true, sem)));
            }
            const choices = semData.filter(r => r['학교지정'] !== 'True');
            const groups = {};
            choices.forEach(r => { const gid = r['선택군_코드'] || '기타'; if (!groups[gid]) groups[gid] = []; groups[gid].push(r); });
            Object.keys(groups).sort().forEach(gid => {
                const groupItems = groups[gid];
                const limit = groupItems[0]['선택군_선택수'] || '1';
                const sep = document.createElement('div'); sep.className = 'group-separator'; sep.innerHTML = `<span>선택 ${gid}</span> <span style="color:#ef4444">${limit}개</span>`;
                content.appendChild(sep);
                groupItems.forEach(r => content.appendChild(createSimItem(r, false, sem, gid)));
            });
        });
        updateSummary();
        setTimeout(() => {
            drawPaths();
            updateScrollMasks();
        }, 200);
    }

    function updateScrollMasks() {
        document.querySelectorAll('.semester-content').forEach(content => {
            const panel = content.closest('.semester-panel');
            const isBottom = content.scrollHeight - content.scrollTop <= content.clientHeight + 10;
            panel.classList.toggle('scrolled-to-bottom', isBottom);
        });
    }

    function createSimItem(row, isMandatory, sem, groupId = null) {
        const item = document.createElement('div');
        const rowId = `${sem}_${row['과목명']}`;
        const cat = row['교과군'];
        item.className = `course-item ${isMandatory ? 'mandatory' : 'choice'}`;
        item.dataset.cat = cat; item.dataset.sem = sem;
        item.id = `item_${rowId.replace(/\s/g, '_')}`;

        item.innerHTML = `
            <div class="item-row">
                <span class="material-icons-round check-box">${isMandatory ? 'check_box' : 'check_box_outline_blank'}</span>
                <span class="course-name">${row['과목명']}</span>
            </div>
            <div class="badges-row">
                <span class="tag" style="background-color:${getCategoryColor(cat)}">${cat}</span>
            </div>`;

        if (!isMandatory) item.onclick = () => toggleSelection(item, row, sem, groupId);
        return item;
    }

    function toggleSelection(el, row, sem, groupId) {
        const rowId = `${sem}_${row['과목명']}`;
        if (selectedCourses.has(rowId)) {
            selectedCourses.delete(rowId);
            el.classList.remove('selected');
            el.querySelector('.check-box').innerText = 'check_box_outline_blank';
        } else {
            const limit = parseInt(row['선택군_선택수'] || '1');
            const selected = Array.from(selectedCourses).filter(id => {
                const [s, n] = id.split("_");
                const r = rawData.find(d => d['과목명'] === n && d[`${s}_학점`]);
                return s === sem && r && r['선택군_코드'] === groupId;
            }).length;
            if (selected >= limit && limit === 1) {
                Array.from(selectedCourses).forEach(id => {
                    if (id.startsWith(sem)) {
                        const [s, n] = id.split("_");
                        const r = rawData.find(d => d['과목명'] === n && d[`${s}_학점`]);
                        if (r && r['선택군_코드'] === groupId) {
                            selectedCourses.delete(id);
                            const other = document.getElementById(`item_${id.replace(/\s/g, '_')}`);
                            if (other) { other.classList.remove('selected'); other.querySelector('.check-box').innerText = 'check_box_outline_blank'; }
                        }
                    }
                });
            } else if (selected >= limit) { alert(`최대 ${limit}개까지 선택 가능합니다.`); return; }
            selectedCourses.add(rowId);
            el.classList.add('selected');
            el.querySelector('.check-box').innerText = 'check_box';
        }
        updateSummary();
        drawPaths();
    }

    function updateSummary() {
        let total = 0, mand = 0;
        rawData.forEach(r => {
            if (r['학교지정'] === 'True') semesters.forEach(s => { const cr = parseInt(r[`${s}_학점`] || '0'); if (cr > 0) { total += cr; mand += cr; } });
        });
        selectedCourses.forEach(id => {
            const [s, n] = id.split("_");
            const r = rawData.find(d => d['과목명'] === n && d[`${s}_학점`]);
            if (r) total += parseInt(r[`${s}_학점`] || '0');
        });
        document.getElementById('totalSelected').innerText = selectedCourses.size;
        document.getElementById('totalMandatoryCredits').innerText = mand;
        document.getElementById('totalCredits').innerText = total;
    }

    function drawPaths(e) {
        if (e && e.target) updateScrollMasks();

        const svg = document.getElementById('svgOverlay');
        svg.innerHTML = '';
        const svgRect = svg.getBoundingClientRect();
        
        const groups = {};
        document.querySelectorAll('.course-item').forEach(el => {
            const cat = el.dataset.cat;
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(el);
        });

        Object.keys(groups).forEach(cat => {
            const items = groups[cat].sort((a, b) => semesters.indexOf(a.dataset.sem) - semesters.indexOf(b.dataset.sem));
            for (let i = 0; i < items.length - 1; i++) {
                const from = items[i], to = items[i+1];
                if (from.dataset.sem === to.dataset.sem) continue;
                
                const isActive = from.classList.contains('selected') || from.classList.contains('mandatory') || 
                                 to.classList.contains('selected') || to.classList.contains('mandatory');
                const isSelectedPath = from.classList.contains('selected') && to.classList.contains('selected');

                const fromRect = from.getBoundingClientRect(), toRect = to.getBoundingClientRect();
                const fromParent = from.closest('.semester-content').getBoundingClientRect(), toParent = to.closest('.semester-content').getBoundingClientRect();
                
                const isVis = fromRect.bottom > fromParent.top && fromRect.top < fromParent.bottom && toRect.bottom > toParent.top && toRect.top < toParent.bottom;
                if (!isVis) continue;

                const x1 = fromRect.right - svgRect.left, y1 = (fromRect.top + fromRect.bottom)/2 - svgRect.top;
                const x2 = toRect.left - svgRect.left, y2 = (toRect.top + toRect.bottom)/2 - svgRect.top;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const cp = x1 + (x2 - x1)/2;
                path.setAttribute("d", `M ${x1} ${y1} C ${cp} ${y1}, ${cp} ${y2}, ${x2} ${y2}`);
                path.setAttribute("class", "path-arrow");
                path.dataset.cat = cat;
                path.style.stroke = getCategoryColor(cat);
                
                if (isSelectedPath) path.classList.add('selected-path');
                else if (isActive) path.classList.add('active');
                
                svg.appendChild(path);
            }
        });
    }

    function renderFullView() {
        const container = document.getElementById('fullViewContent');
        container.innerHTML = '<table style="width:100%; border-collapse:collapse; font-size:0.8rem;"><thead><tr style="background:#f1f5f9;">';
        const headers = Object.keys(rawData[0]).filter(h => !['원본행', '선택군_행범위'].includes(h));
        headers.forEach(h => container.innerHTML += `<th style="padding:8px; border:1px solid #e2e8f0; text-align:left;">${h}</th>`);
        container.innerHTML += '</tr></thead><tbody id="fullTableBody"></tbody></table>';
        const tbody = document.getElementById('fullTableBody');
        rawData.forEach(row => {
            let tr = '<tr>'; headers.forEach(h => tr += `<td style="padding:8px; border:1px solid #e2e8f0;">${row[h] || ''}</td>`);
            tr += '</tr>'; tbody.innerHTML += tr;
        });
    }
    init();
</script>
</body>
</html>
