<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

        :root {
            --primary-color: #2c3e50;

            --border-color: #dee2e6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 6px; font-size: 1.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 0.9em; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            background: #f1f4f6;
            padding: 14px;
            border-radius: 8px;
            align-items: flex-end;
        }
        .control-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
        label { font-size: 0.82em; font-weight: bold; margin-bottom: 4px; color: var(--secondary-color); }
        select, input {
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--accent-color); }
        .count { font-size: 0.85em; color: #666; margin-bottom: 8px; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
        th, td { border: 1px solid var(--border-color); padding: 10px 12px; text-align: left; line-height: 1.5; vertical-align: top; }
        th { background-color: var(--primary-color); color: white; position: sticky; top: 0; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #eef2f5; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.78em; font-weight: bold; margin-right: 4px; vertical-align: middle; }
        .badge-core { background: #ffeaa7; color: #c0392b; }
        .badge-rec { background: #d6eaf8; color: #1a6da8; }
        .no-data { text-align: center; padding: 30px; color: #7f8c8d; }
        @media (max-width: 600px) { .controls { flex-direction: column; } }

        /* ── 요약 패널 ── */
        #summaryPanel { display:none; margin-bottom:20px; border:1px solid #e0e6ed; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .sum-header { background:linear-gradient(135deg,#2c3e50,#3d5a73); color:white; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
        .sum-header .kw { color:#f9ca24; font-weight:700; }
        .sum-header .sum-meta { font-size:0.82em; opacity:0.75; }
        .sum-tip { font-size:0.75em; opacity:0.65; margin-top:2px; }
        .sum-body { background:#fff; }

        .sblk { border-bottom:1px solid #edf0f4; }
        .sblk:last-child { border-bottom:none; }
        .stoggle { display:flex; align-items:center; gap:10px; padding:12px 18px; cursor:pointer; font-size:0.87em; font-weight:600; transition:background 0.15s; user-select:none; }
        .stoggle:hover { background:#f8f9fa; }
        .stoggle .sname { flex:1; }
        .stoggle .scnt { font-size:0.78em; font-weight:700; background:rgba(0,0,0,0.08); border-radius:12px; padding:2px 8px; color:#555; }
        .stoggle .sarr { font-size:0.72em; color:#aaa; transition:transform 0.2s; }
        .stoggle.open .sarr { transform:rotate(180deg); }
        .scontent { display:none; padding:4px 18px 16px; }
        .scontent.open { display:block; }

        .tag-list { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
        .tag { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px; font-size:0.81em; font-weight:600; cursor:pointer; border:2px solid transparent; transition:all 0.15s; }

        .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:0.79em; }
        .bar-label { width:140px; text-align:right; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
        .bar-track { flex:1; background:#edf0f4; border-radius:4px; height:18px; }
        .bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px; transition:width 0.45s ease; }
        .bar-fill span { font-size:0.77em; font-weight:700; color:white; white-space:nowrap; }

        .ck { background:#e74c8b; color:#e74c8b; } .fk { background:#e74c8b; }
        .ce { background:#27ae60; color:#27ae60; } .fe { background:#27ae60; }

        .co { background:#7f8c8d; color:#7f8c8d; } .fo { background:#7f8c8d; }

        .author-banner {
            max-width: 1200px;
            margin: 0 auto 12px;

            background: linear-gradient(135deg, #2c3e50, #3d5a73);

    </style>
</head>

    keywords:['과학','물리학','화학','생명과학','지구과학','역학과 에너지','전자기와 양자','물질과 에너지','화학 반응','세포와 물질대사','생물의 유전','생물과 유전','행성우주과학','지구시스템'] },
  { key:'other',   label:'기타', icon:'📚', tc:'co', fc:'fo',
    keywords:['정보','기술·가정','제2외국어','한문','한국어','중국어','일본어','교양','체육','음악','미술','제2외국어'] }
];

function classifyTerms(text) {
  // 텍스트에서 교과별 키워드를 추출해 {key: [term,...]} 반환
  const result = {};
  if (!text || text === '-') return result;
  // 콤마/대괄호 기준으로 항목 분리
  const parts = text.split(/,|、|【|】|\[|\]/).map(s => s.trim()).filter(Boolean);
  parts.forEach(part => {
    SUBJECTS.forEach(s => {
      if (s.keywords.some(kw => part.includes(kw))) {
        if (!result[s.key]) result[s.key] = [];
        if (!result[s.key].includes(part)) result[s.key].push(part);
      }
    });
  });
  return result;
}

// ── 대학 드롭다운 ──────────────────────────────────────────
const unis = [...new Set(database.map(d => d.uni).filter(Boolean))];
let selectedUni = 'all';

function buildDropdown(filter) {
  const q = (filter || '').toLowerCase();
  const matched = q ? unis.filter(u => u.toLowerCase().includes(q)) : unis;
  uniDropdown.innerHTML = '';
  const allItem = document.createElement('div');
  allItem.textContent = '전체 대학';
  allItem.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:0.9em;color:#666;';
  allItem.addEventListener('mousedown', () => selectUni('all', ''));
  uniDropdown.appendChild(allItem);
  matched.forEach(u => {
    const item = document.createElement('div');
    item.textContent = u;
    item.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:0.9em;';
    item.addEventListener('mouseover', () => item.style.background='#eef2f5');
    item.addEventListener('mouseout',  () => item.style.background='');
    item.addEventListener('mousedown', () => selectUni(u, u));
    uniDropdown.appendChild(item);
  });
  uniDropdown.style.display = (matched.length || !q) ? 'block' : 'none';
}

function selectUni(val, label) {
  selectedUni = val;
  uniInput.value = label;
  uniDropdown.style.display = 'none';
  renderTable();
}

uniInput.addEventListener('focus', () => buildDropdown(uniInput.value));
uniInput.addEventListener('input', () => { selectedUni = 'all'; buildDropdown(uniInput.value); renderTable(); });
uniInput.addEventListener('blur',  () => setTimeout(() => { uniDropdown.style.display='none'; }, 150));

// ── 활성 태그 강조 상태 ───────────────────────────────────
let activeTag = null; // {key, term}

// ── 요약 패널 렌더링 ─────────────────────────────────────
function renderSummary(filtered, keyword) {
  const hasKeyword = keyword && keyword.trim();
  if (!hasKeyword || filtered.length === 0) {
    summaryPanel.style.display = 'none';
    return;
  }
  summaryPanel.style.display = 'block';
  sumKw.textContent = keyword;
  sumTotal.textContent = filtered.length + '건';

  // 전체 텍스트에서 교과별 과목 카운팅
  const termCount = {}; // key -> {term -> count}
  filtered.forEach(d => {
    const allText = [d.core, d.rec].join(', ');
    const classified = classifyTerms(allText);
    Object.entries(classified).forEach(([key, terms]) => {
      if (!termCount[key]) termCount[key] = {};
      terms.forEach(t => {
        // 더 정밀하게: 실제 과목명 정규화
        const norm = t.replace(/\s+/g,' ').trim();
        termCount[key][norm] = (termCount[key][norm] || 0) + 1;
      });
    });
  });

  // 교과군별 대표 카운트(핵심과목 기준)
  const coreCount = {};
  filtered.forEach(d => {
    if (!d.core || d.core==='-') return;
    const classified = classifyTerms(d.core);
    Object.keys(classified).forEach(key => {
      coreCount[key] = (coreCount[key] || 0) + 1;
    });
  });

  sumBody.innerHTML = '';

  SUBJECTS.forEach(subj => {
    const terms = termCount[subj.key];
    if (!terms || Object.keys(terms).length === 0) return;

    const totalMention = Object.values(terms).reduce((a,b)=>a+b, 0);
    const sorted = Object.entries(terms).sort((a,b)=>b[1]-a[1]);
    const maxCnt = sorted[0][1];

    const blk = document.createElement('div');
    blk.className = 'sblk';

    const toggle = document.createElement('div');
    toggle.className = 'stoggle';
    toggle.innerHTML = `
      <span class="subj-icon">${subj.icon}</span>
      <span class="sname" style="color:${getColor(subj.tc)}">${subj.label}</span>
      <span class="scnt">${Object.keys(terms).length}종</span>
      <span class="sarr">▼</span>`;
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('open');
      content.classList.toggle('open');
    });

    const content = document.createElement('div');
    content.className = 'scontent open'; // 기본 열림

    // 태그 목록
    const tagList = document.createElement('div');
    tagList.className = 'tag-list';
    sorted.forEach(([term, cnt]) => {
      const tag = document.createElement('span');
      tag.className = `tag ${subj.tc}`;
      tag.style.background = getBg(subj.tc);
      tag.style.color = getColor(subj.tc);
      tag.innerHTML = `${esc(term)} <span class="tcnt">${cnt}</span>`;
      tag.addEventListener('click', () => {
        const isActive = activeTag && activeTag.key===subj.key && activeTag.term===term;
        activeTag = isActive ? null : {key: subj.key, term};
        // 모든 태그 active 해제 후 현재만 active
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        if (!isActive) tag.classList.add('active');
        renderTableRows(currentFiltered);
      });
      tagList.appendChild(tag);
    });
    content.appendChild(tagList);

    // 막대 차트 (상위 8개)
    const chart = document.createElement('div');
    chart.className = 'bar-chart';
    sorted.slice(0, 8).forEach(([term, cnt]) => {
      const pct = Math.max(8, Math.round(cnt / filtered.length * 100));
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-label" title="${esc(term)}">${esc(term)}</div>
        <div class="bar-track">
          <div class="bar-fill ${subj.fc}" style="width:${pct}%">
            <span>${cnt}건 (${pct}%)</span>
          </div>
        </div>`;
      chart.appendChild(row);
    });
    content.appendChild(chart);

    blk.appendChild(toggle);
    blk.appendChild(content);
    sumBody.appendChild(blk);
  });
}

function getColor(tc) {
  const map = {cm:'#2878c8',ck:'#c0256e',ce:'#1e8449',cs:'#d68910',cc:'#6c3483',co:'#5d6d7e'};
  return map[tc] || '#333';
}
function getBg(tc) {
  const map = {cm:'#eaf3fb',ck:'#fde8f3',ce:'#e9f7ef',cs:'#fef9e7',cc:'#f4ecf7',co:'#f2f3f4'};
  return map[tc] || '#f8f9fa';
}

// ── 테이블 렌더링 ─────────────────────────────────────────
let currentFiltered = [];

function renderTable() {
  const uniQuery = uniInput.value.toLowerCase();
  const srch = searchBox.value.toLowerCase().trim();
  const subj = subjectSearch.value.toLowerCase().trim();

  currentFiltered = database.filter(d => {
    if (selectedUni !== 'all') { if (d.uni !== selectedUni) return false; }
    else if (uniQuery) { if (!d.uni.toLowerCase().includes(uniQuery)) return false; }
    if (srch && !d.dept.toLowerCase().includes(srch)) return false;
    if (subj && !(d.core.toLowerCase().includes(subj) || d.rec.toLowerCase().includes(subj))) return false;
    return true;
  });

  // 요약은 학과 검색어 or 과목 검색어가 있을 때만
  const keyword = srch || subj;
  renderSummary(currentFiltered, keyword);

  countInfo.textContent = `검색 결과: ${currentFiltered.length}건`;
  renderTableRows(currentFiltered);
}

function renderTableRows(rows) {
  tableBody.innerHTML = '';
  if (rows.length === 0) {
    tableBody.innerHTML = '<tr><td colspan="5" class="no-data">검색 결과가 없습니다.</td></tr>';
    return;
  }

  const srch = searchBox.value.trim();
  const subj = subjectSearch.value.trim();

  rows.forEach(d => {
    const tr = document.createElement('tr');

    // 태그 강조: activeTag와 일치하는 과목이 포함된 행 하이라이트
    if (activeTag) {
      const allText = [d.core, d.rec].join(' ');
      if (allText.includes(activeTag.term)) {
        tr.style.background = '#fffde7';
        tr.style.outline = '2px solid #f39c12';
      }
    }

    const coreHtml = d.core && d.core!=='-'
      ? `<span class="badge badge-core">핵</span>${highlight(esc(d.core), [srch,subj])}`
      : (d.core||'');
    const recHtml = d.rec && d.rec!=='-'
      ? `<span class="badge badge-rec">권</span>${highlight(esc(d.rec), [srch,subj])}`
      : '';

    tr.innerHTML = `
      <td><strong>${esc(d.uni)}</strong></td>
      <td>${highlight(esc(d.dept),[srch])}</td>
      <td>${coreHtml}</td>
      <td>${recHtml}</td>
      <td style="font-size:0.82em;color:#555">${esc(d.note)}</td>`;
    tableBody.appendChild(tr);
  });
}

function highlight(text, keywords) {
  if (!text) return '';
  let result = text;
  keywords.filter(Boolean).forEach(kw => {
    if (!kw) return;
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    result = result.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
  });
  return result;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

searchBox.addEventListener('input', renderTable);
subjectSearch.addEventListener('input', renderTable);
renderTable();

</script>
